<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自分のブレーキタイプ診断</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #FF8FAB;
    --peach: #FFB3C1;
    --lavender: #C8B6E2;
    --mint: #B5EAD7;
    --yellow: #FFDEAD;
    --cream: #FFF8F0;
    --white: #FFFFFF;
    --text: #4A3F55;
    --text-light: #8B7B96;
    --shadow: rgba(200, 150, 180, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    color: var(--text);
    overflow-x: hidden;
  }

  /* 背景の丸い装飾 */
  body::before {
    content: '';
    position: fixed;
    top: -80px; right: -80px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, #FFD6E0 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -60px; left: -60px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, #D4EEFF 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    position: relative;
    z-index: 1;
  }

  /* ヘッダー */
  .header {
    text-align: center;
    margin-bottom: 28px;
    animation: fadeDown 0.6s ease;
  }
  .header .emoji-row {
    font-size: 28px;
    letter-spacing: 6px;
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 900;
    color: var(--text);
    line-height: 1.4;
    letter-spacing: 0.05em;
  }
  .header h1 span {
    color: var(--pink);
  }
  .header p {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-light);
  }

  /* カード */
  .card {
    background: var(--white);
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 8px 32px var(--shadow);
    animation: fadeUp 0.5s ease;
  }

  /* 進捗バー */
  .progress-wrap {
    margin-bottom: 22px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 8px;
    background: #F0E6F6;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--lavender));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  /* 質問 */
  .question-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--pink), var(--peach));
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 12px;
    letter-spacing: 0.08em;
  }
  .question-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.6;
    margin-bottom: 22px;
    color: var(--text);
  }

  /* 選択肢 */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn {
    background: #FBF6FF;
    border: 2px solid #EAD9F7;
    border-radius: 16px;
    padding: 14px 18px;
    text-align: left;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
    line-height: 1.5;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .option-btn:active {
    transform: scale(0.97);
  }
  .option-btn:hover {
    background: #FFF0F5;
    border-color: var(--pink);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(255,143,171,0.2);
  }
  .option-icon {
    font-size: 20px;
    flex-shrink: 0;
  }

  /* 結果 */
  .result-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .result-emoji {
    font-size: 52px;
    display: block;
    margin-bottom: 8px;
    animation: bounceIn 0.6s ease;
  }
  .result-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 16px;
    border-radius: 99px;
    margin-bottom: 10px;
    letter-spacing: 0.08em;
  }
  .result-type {
    font-size: 24px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: 0.04em;
  }

  .result-section {
    margin-top: 20px;
  }
  .section-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--pink);
    margin-bottom: 10px;
    letter-spacing: 0.06em;
  }
  .section-label::before {
    content: '';
    display: block;
    width: 4px; height: 16px;
    background: linear-gradient(to bottom, var(--pink), var(--lavender));
    border-radius: 99px;
  }

  .feature-box {
    background: #FBF6FF;
    border-radius: 16px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.9;
    color: var(--text);
    border-left: 3px solid var(--lavender);
  }
  .feature-box .highlight {
    display: inline-block;
    background: linear-gradient(135deg, #FFE0E9, #F0D8FF);
    border-radius: 8px;
    padding: 2px 8px;
    font-weight: 700;
    margin: 2px 0;
  }

  .work-box {
    background: linear-gradient(135deg, #FFF5F8, #F8F0FF);
    border-radius: 16px;
    padding: 18px;
    border: 2px dashed #F0C0D5;
    position: relative;
  }
  .work-step {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }
  .work-step-icon {
    font-size: 22px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .work-text strong {
    color: var(--pink);
    font-weight: 700;
    font-size: 15px;
  }

  /* まとめ */
  .summary-box {
    background: linear-gradient(135deg, #FFF0F5, #F3EEFF);
    border-radius: 20px;
    padding: 22px;
    text-align: center;
    margin-top: 20px;
    border: 2px solid #F0D8F0;
  }
  .summary-box p {
    font-size: 14px;
    line-height: 2;
    color: var(--text);
  }
  .summary-box .big-text {
    font-size: 17px;
    font-weight: 700;
    color: var(--pink);
    display: block;
    margin: 8px 0;
  }

  /* やり直しボタン */
  .retry-btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    color: white;
    border: none;
    border-radius: 99px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.06em;
    box-shadow: 0 4px 16px rgba(255,143,171,0.4);
    transition: all 0.2s;
  }
  .retry-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,143,171,0.5);
  }
  .retry-btn:active {
    transform: scale(0.97);
  }

  /* 区切り */
  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, #EAD9F7, transparent);
    margin: 20px 0;
  }

  /* アニメーション */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounceIn {
    0%   { transform: scale(0.5); opacity: 0; }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .hidden { display: none; }

  /* スクロールトップ用 */
  .scroll-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-light);
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="emoji-row">🔍</div>
    <h1>自分の<span>ブレーキ</span>タイプ診断</h1>
    <p>あなたが動けない理由がわかります</p>
  </div>

  <div class="card" id="quiz-card">
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-label">
        <span id="progress-text">Q1 / 2</span>
        <span id="progress-pct">50%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:50%"></div>
      </div>
    </div>

    <div id="question-area"></div>
  </div>
</div>

<script>
const questions = {
  q1: {
    id: 'q1',
    badge: 'まず最初に',
    text: 'あなたが今、一番近い状態は？',
    options: [
      { icon: '🔥', text: 'やりたいことはあるけど、なぜか動けない', next: 'q2a' },
      { icon: '🌀', text: 'そもそも何がやりたいのかよくわからない', next: 'q2b' },
    ]
  },
  q2a: {
    id: 'q2a',
    badge: 'Q2',
    text: 'いざ動こうとすると、\n心の中で出てくるのはどれ？',
    options: [
      { icon: '😱', text: '「失敗したらどうしよう…」', result: 'r1' },
      { icon: '📚', text: '「もう少し準備してから」', result: 'r2' },
      { icon: '⏰', text: '「時間がなくて…」', result: 'r3' },
      { icon: '👀', text: '「周りにどう思われるかな」', result: 'r4' },
    ]
  },
  q2b: {
    id: 'q2b',
    badge: 'Q2',
    text: '「わからない」の正体は\nどれに近い？',
    options: [
      { icon: '🔍', text: '好きなことが思い浮かばない', result: 'r5' },
      { icon: '🌊', text: '選択肢が多すぎて選べない', result: 'r6' },
      { icon: '🫥', text: '自分にはどうせできない気がする', result: 'r7' },
    ]
  }
};

const results = {
  r1: {
    emoji: '🎬',
    type: '失敗こわい族',
    feature: `まだ何も起きていないのに、脳内で\n<span class="highlight">「大失敗スペシャル」</span>が上映中。\nしかも満席。\n\n「もし上手くいかなかったら…」\n失敗したあとの妄想が止まらない。\n\nでも現実はまだ、何も起きていません。`,
    work: `紙に<strong>「失敗したら困ること」を3つ</strong>書いてみよう。\n\nその横に\n「本当にそうなる？」\nと書いてみる。\n\n意外と脳内上映会だったことに気づくかも。`
  },
  r2: {
    emoji: '⚔️',
    type: '準備しすぎ職人',
    feature: `まだレベル1のスライムしか出てこないのに、伝説の武器を探してるタイプ。\n\n武器を集めてるうちに\nラスボスが老衰で倒れそう。\n\n学ぶのは得意だけど、行動が後回し。`,
    work: `今日は新しく調べるの<strong>禁止</strong>。\n今知っていることで、どれか1つやってみよう。\n\n📝 メモに書き出すだけ\n💬 家族や友人に話してみる\n📲 SNSの下書きを書く（できる人は投稿！）\n🤖 AIに「こんなことやりたい」と投げてみる\n\n考えてるだけより、絶対前に進む。`
  },
  r3: {
    emoji: '📱',
    type: '時間ないない団',
    feature: `本当に忙しい。\n\nでも\n<span class="highlight">「まとまった時間がないとできない」</span>\nと思っている可能性あり。\n\nスマホのスクリーンタイム、\n確認すると意外と時間が作れるかも。`,
    work: `タイマーを<strong>5分セット</strong>。\n\nその5分だけ\nやりたいことをやってみよう。\n\n5分なら意外と動ける。`
  },
  r4: {
    emoji: '🎭',
    type: '脳内観客席満員タイプ',
    feature: `何か始めようとすると、\n脳内の観客席が満員になる。\nそして聞いてもいないのに、\n観客たちがザワつき始める。\n\n「夫に何か言われるかも…」\n「ママ友に変だと思われるんじゃない？」\n「周りに迷惑かけるかも」\n\nでも安心してください。\nその観客、ほぼ架空です。`,
    work: `ノートに書いてみよう。\n\n<strong>「お金も時間も気にしなくていいなら、本当は何がしたい？」</strong>\n\n正解はないし、誰にも見せなくていい。\n自分の本音に、こっそり耳を傾けてみよう。`
  },
  r5: {
    emoji: '🗺️',
    type: '好き迷子タイプ',
    feature: `好きなことがわからない、と思っているけど実は\n<span class="highlight">「正解の好き」</span>を探しているのかも。\n\n「これって本当に好きって言える？」\n「続けられなかったら意味ないし」\n「もっとちゃんとしたものを見つけなきゃ」\n\n「好き」に正解なんて、ないんですよ。`,
    work: `「ちょっと気になる」\nを書き出してみよう。\n\n好きじゃなくてOK。\n<strong>10個出せたら優勝</strong>🏆`
  },
  r6: {
    emoji: '🚦',
    type: '選択肢渋滞タイプ',
    feature: `やりたいことが多すぎて\n脳内が連休中の高速道路。\n\n「あれもいい、これもいい」\n「どれかを選んだら他を諦めることになる」\n全部大切で捨てられない。`,
    work: `今月やることを\n<strong>1つだけ</strong>決めよう。\n\n残りは捨てなくていい。\n<strong>保留</strong>でOK。`
  },
  r7: {
    emoji: '🙅',
    type: '自分に辛口すぎタイプ',
    feature: `何かやりたいことが浮かぶと\n自分へのダメ出し大会が始まる。\n\n応募すらしてないのに\n脳内人事部から\n不採用通知が届くタイプ。`,
    work: `今日あった<strong>「よかったこと」を3つ</strong>探してみよう。\n\n大きなことでなくてOK。\n\n・ご飯がおいしかった\n・風が気持ちよかった\n・子どもが笑った\n\nそんなレベルで十分。`
  }
};

let currentQ = 'q1';
let step = 1;

function getProgress(qid) {
  if (qid === 'q1') return { current: 1, total: 2, pct: 50 };
  return { current: 2, total: 2, pct: 100 };
}

function renderQuestion(qid) {
  currentQ = qid;
  const q = questions[qid];
  const prog = getProgress(qid);

  document.getElementById('progress-wrap').style.display = '';
  document.getElementById('progress-text').textContent = `Q${prog.current} / ${prog.total}`;
  document.getElementById('progress-pct').textContent = prog.pct + '%';
  document.getElementById('progress-fill').style.width = prog.pct + '%';

  const area = document.getElementById('question-area');
  area.innerHTML = '';

  const badge = document.createElement('div');
  badge.className = 'question-badge';
  badge.textContent = q.badge;

  const qtext = document.createElement('div');
  qtext.className = 'question-text';
  qtext.textContent = q.text;

  const opts = document.createElement('div');
  opts.className = 'options';

  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-icon">${opt.icon}</span><span>${opt.text}</span>`;
    btn.addEventListener('click', () => {
      if (opt.next) {
        renderQuestion(opt.next);
      } else if (opt.result) {
        renderResult(opt.result);
      }
    });
    opts.appendChild(btn);
  });

  area.appendChild(badge);
  area.appendChild(qtext);
  area.appendChild(opts);

  // カードをリアニメート
  const card = document.getElementById('quiz-card');
  card.style.animation = 'none';
  requestAnimationFrame(() => {
    card.style.animation = 'fadeUp 0.4s ease';
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderResult(rid) {
  const r = results[rid];
  const card = document.getElementById('quiz-card');

  document.getElementById('progress-wrap').style.display = 'none';

  // feature テキストを改行・HTMLで処理
  function formatText(text) {
    return text.split('\n').map(line => line ? `<p style="margin-bottom:4px">${line}</p>` : `<br>`).join('');
  }

  card.innerHTML = `
    <div class="result-header">
      <span class="result-emoji">${r.emoji}</span>
      <div class="result-badge">あなたのブレーキタイプ</div>
      <div class="result-type">${r.type}</div>
    </div>

    <div class="divider"></div>

    <div class="result-section">
      <div class="section-label">どんなタイプ？</div>
      <div class="feature-box">${formatText(r.feature)}</div>
    </div>

    <div class="result-section" style="margin-top:18px">
      <div class="section-label">今日からのプチワーク ✍️</div>
      <div class="work-box">
        <div class="work-step">
          <span class="work-step-icon">🌱</span>
          <div class="work-text">${formatText(r.work)}</div>
        </div>
      </div>
    </div>

    <div class="summary-box">
      <p>
        動けないのは<br>
        あなたがダメだからじゃない。<br>
        原因があるだけ。
        <span class="big-text">原因がわかれば、対策も見えてくる。</span>
        今日のプチワーク、<br>ひとつだけやってみませんか？🌸
      </p>
    </div>

    <button class="retry-btn" onclick="restartQuiz()">🔄 もう一度やってみる</button>
    <p class="scroll-hint">↑ 結果を保存したいときはスクリーンショットをどうぞ</p>
  `;

  card.style.animation = 'none';
  requestAnimationFrame(() => {
    card.style.animation = 'fadeUp 0.5s ease';
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
  const card = document.getElementById('quiz-card');
  card.innerHTML = `
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-label">
        <span id="progress-text">Q1 / 2</span>
        <span id="progress-pct">50%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:50%"></div>
      </div>
    </div>
    <div id="question-area"></div>
  `;
  renderQuestion('q1');
}

// 初期表示
renderQuestion('q1');
</script>
</body>
</html>
